services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: ochoa2_staging_app
    restart: unless-stopped
    mem_limit: 500m
    volumes:
      - ./src:/var/www/html:z
    env_file:
      - .env.prod
    networks:
      - ochoa2_network

  web:
    image: nginx:alpine
    container_name: ochoa2_staging_web
    restart: unless-stopped
    mem_limit: 80m
    volumes:
      - ./src:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      - ochoa2_network
      - proxy
    depends_on:
      - app

networks:
  ochoa2_network:
    external: true
    name: ochoa-v2_ochoa2_network
  proxy:
    external: true
