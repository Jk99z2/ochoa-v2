services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: ochoa2_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:z
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: ochoa2_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ochoa2_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ochoa
      MYSQL_USER: ochoa
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF

volumes:
  dbdata: